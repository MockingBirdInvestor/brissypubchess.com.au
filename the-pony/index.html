    <!--
      Newest first. To add a comic, copy one <figure> block to the top and
      change the number in it. Each comic has a 640px wide copy for phones and
      a copy up to 1024px wide for computers; the browser picks one. The
      newest comic loads straight away; older ones load as people scroll down.
    -->

    <figure class="comic">
      <img src="../images/the-pony/the-pony-5-640.webp"
           srcset="../images/the-pony/the-pony-5-640.webp 640w, ../images/the-pony/the-pony-5-1024.webp 1024w"
           sizes="(min-width: 48rem) 46rem, 100vw"
           width="1024" height="572"
           alt="The Pony plays chess against a Victorian gentleman, with sandglasses for clocks. Caption: I like chess: it fascinates me. I can look at it all day. The Pony thinks hard, the gentleman points at the empty sandglass and says Time., and The Pony looks sad.">
      <figcaption>The Pony #5</figcaption>
    </figure>

    <figure class="comic">
      <img src="../images/the-pony/the-pony-4-640.webp"
           srcset="../images/the-pony/the-pony-4-640.webp 640w, ../images/the-pony/the-pony-4-825.webp 825w"
           sizes="(min-width: 48rem) 46rem, 100vw"
           loading="lazy"
           width="825" height="1024"
           alt="How do chess players stay in shape? The Pony lifts a barbell with a rook at each end. They lift rooks. Below: What is a rook lift in chess? In chess, a rook lift happens when a player moves their rook up the board from its starting rank.">
      <figcaption>The Pony #4</figcaption>
    </figure>

    <figure class="comic">
      <img src="../images/the-pony/the-pony-3-640.webp"
           srcset="../images/the-pony/the-pony-3-640.webp 640w, ../images/the-pony/the-pony-3-1024.webp 1024w"
           sizes="(min-width: 48rem) 46rem, 100vw"
           loading="lazy"
           width="1024" height="1090"
           alt="Two horses in Oktoberfest outfits at a chess board clink steins of Festbier and say Prost!, three panels in a row, with more empty glasses each time. In the last panel both are asleep on the table: Draw by repetition.">
      <figcaption>The Pony #3</figcaption>
    </figure>

    <figure class="comic">
      <img src="../images/the-pony/the-pony-2-640.webp"
           srcset="../images/the-pony/the-pony-2-640.webp 640w, ../images/the-pony/the-pony-2-1024.webp 1024w"

           loading="lazy"
           width="1024" height="925"
           alt="The Pony phones from heaven: I have good news and bad news. Heaven has chess every night! Bobby Fischer, Capablanca, Daniel Naroditsky ... they're all here. At Brissy Pub Chess, a horse answers: What's the bad news? You're black against Capablanca this Wednesday! ... and you'll miss Pub Chess! The pairings read Board 1: Capablanca (W) vs The Pony (B), Board 2: Fischer (W) vs Naroditsky (B).">
      <figcaption>The Pony #2</figcaption>
    </figure>

    <figure class="comic">
